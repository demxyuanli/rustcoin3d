[workspace]
members = [
    "crates/rc3d-core",
    "crates/rc3d-fields",
    "crates/rc3d-scene",
    "crates/rc3d-nodes",
    "crates/rc3d-actions",
    "crates/rc3d-mesh",
    "crates/rc3d-nurbs",
    "crates/rc3d-render",
    "crates/rc3d-engine",
    "crates/rc3d-io",
    "crates/rc3d-shape",
    "crates/rc3d-app",
    "crates/rc3d-cli-editor",
    "crates/rc3d-gizmo",
    "crates/rc3d-script",
    "crates/rc3d-pointcloud",
    "crates/rc3d-pdf",
    "crates/rc3d-scene-api",
    "crates/rc3d-effects",
    "crates/rc3d-engine-api",
    "crates/rc3d-editor",
    "crates/rc3d-examples",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "BSD-3-Clause"

[workspace.dependencies]
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = { version = "1.0", features = ["serde"] }
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
thiserror = "2.0"
log = "0.4"
lru = "0.12"
env_logger = "0.11"
rayon = "1.10"
tracy-client = { version = "0.18", default-features = false }
glyphon = "0.8"
meshopt = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
rhai = { version = "1", features = ["f32_float"] }

# Internal crates
rc3d-core = { path = "crates/rc3d-core" }
rc3d-fields = { path = "crates/rc3d-fields" }
rc3d-scene = { path = "crates/rc3d-scene" }
rc3d-nodes = { path = "crates/rc3d-nodes" }
rc3d-actions = { path = "crates/rc3d-actions" }
rc3d-mesh = { path = "crates/rc3d-mesh" }
rc3d-render = { path = "crates/rc3d-render" }
rc3d-engine = { path = "crates/rc3d-engine" }
rc3d-shape = { path = "crates/rc3d-shape" }
rc3d-io = { path = "crates/rc3d-io" }
rc3d-app = { path = "crates/rc3d-app" }
rc3d-gizmo = { path = "crates/rc3d-gizmo" }
rc3d-nurbs = { path = "crates/rc3d-nurbs" }
rc3d-pointcloud = { path = "crates/rc3d-pointcloud" }
rc3d-pdf = { path = "crates/rc3d-pdf" }
rc3d-script = { path = "crates/rc3d-script" }
rc3d-cli-editor = { path = "crates/rc3d-cli-editor" }
rc3d-scene-api = { path = "crates/rc3d-scene-api" }
rc3d-effects = { path = "crates/rc3d-effects" }
rc3d-engine-api = { path = "crates/rc3d-engine-api" }
rc3d-editor = { path = "crates/rc3d-editor" }
rc3d-examples = { path = "crates/rc3d-examples" }

[profile.test]
opt-level = 1

[workspace.lints.clippy]
# Style preferences — not actionable at current scale
too_many_arguments = "allow"
type_complexity = "allow"
# Intentional: extends lifetimes for safety in generated code
drop_non_drop = "allow"
# Code patterns that cannot be trivially refactored
same_item_push = "allow"
needless_borrows_for_generic_args = "allow"
